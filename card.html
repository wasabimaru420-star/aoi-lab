<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カード紹介</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* レイアウト全体 */
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        /* 右上のボタン配置 */
        .top-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .top-buttons a {
            padding: 8px 14px;
            background: #222;
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            border: 1px solid #555;
        }

        /* 左右のメインレイアウト */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            padding-top: 80px;
        }

        /* 左側：説明 */
        .left {
            width: 40%;
            padding: 40px;
        }

        .left h1 {
            margin-bottom: 20px;
        }

        /* 右側：キャラ画像（パララックス対象） */
        .right {
            width: 60%;
            position: relative;
            overflow: hidden;
        }

        .char-img {
            position: absolute;
            right: 10%;
            top: 0;
            width: 60%;
            transition: transform 0.3s ease;
        }

        /* 左上のカードアイコン */
        .switch-icon {
    position: fixed;
    top: 20px;
    left: 20px;   /* ← ここを right から left に変更 */
    width: 80px;
    cursor: pointer;
    transition: transform 0.6s ease;
    z-index: 1000;
}

        /* カード回転アニメ */
        .flip {
            transform: rotateY(180deg);
        }
    </style>
</head>

<body>

    <!-- 右上ボタン -->
    <div class="top-buttons">
        <a href="index.html">トップページへ戻る</a>
        <a href="characters.html">キャラ一覧へ戻る</a>
    </div>

    <!-- カードアイコン（切り替えボタン） -->
    <img src="assets/img/イラスト13.webp" class="switch-icon" id="switchIcon">

    <div class="container">
        <!-- 左側：説明 -->
        <div class="left">
            <h1 id="charName">カード</h1>
            <p id="charDesc">カードの説明文をここに書く。</p>
        </div>

        <!-- 右側：キャラ画像（パララックス） -->
        <div class="right">
            <img src="assets/img/イラスト13.webp" id="charImage" class="char-img">
        </div>
    </div>

    <script>
        /* キャラ切り替えデータ */
        const characters = [
            {
                name: "ラム",
                desc: "ラムの説明文。",
                img: "assets/img/イラスト9.webp"
            },
            {
                name: "アル",
                desc: "アルの説明文。",
                img: "assets/img/イラスト10.webp"
            },
            {
                name: "カード",
                desc: "カードの説明文。",
                img: "assets/img/イラスト13.webp"
            }
        ];

        let index = 0;

        const switchIcon = document.getElementById("switchIcon");
        const charName = document.getElementById("charName");
        const charDesc = document.getElementById("charDesc");
        const charImage = document.getElementById("charImage");

        /* カードアイコンを押したらキャラ切り替え */
        switchIcon.addEventListener("click", () => {
            index = (index + 1) % characters.length;

            // カード回転
            switchIcon.classList.add("flip");
            setTimeout(() => switchIcon.classList.remove("flip"), 600);

            // 内容切り替え
            charName.textContent = characters[index].name;
            charDesc.textContent = characters[index].desc;
            charImage.src = characters[index].img;
        });

        /* パララックス：スクロールでキャラ画像が上下に動く */
        window.addEventListener("scroll", () => {
            const scrollY = window.scrollY;
            charImage.style.transform = `translateY(${scrollY * 0.3}px)`;
        });
    </script>

</body>
</html>
