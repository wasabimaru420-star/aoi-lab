<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カード紹介</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    /* 右上の戻るボタン */
    .top-buttons {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    .top-buttons a {
      padding: 8px 14px;
      background: #222;
      border-radius: 6px;
      color: #fff;
      text-decoration: none;
      border: 1px solid #555;
    }

    /* 左右レイアウト */
    .container {
      display: flex;
      width: 100%;
      height: auto;
      padding-top: 80px;
    }

    .left {
  width: 40%;
  padding: 40px;
  position: fixed;   /* ← これを追加 */
  top: 80px;         /* ← 説明文の縦位置 */
  left: 0;           /* ← 左端に固定 */
}

    .left h1 {
      margin-bottom: 20px;
    }

    .right {
      width: 60%;
      position: relative;
      overflow: hidden;
    }

    .char-img {
      position: absolute;
      right: 10%;
      top: 0;
      width: 90%;
      transition: transform 0.3s ease;
    }

    /* 左上カードアイコン */
    .switch-icon {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 120px;
      cursor: pointer;
      transition: transform 0.6s ease;
      z-index: 1000;
    }

    .flip {
      transform: rotateY(180deg);
    }
  </style>
</head>

<body>
  <!-- 右上ボタン -->
  <div class="top-buttons">
    <a href="index.html">トップページへ戻る</a>
    <a href="characters.html">キャラ一覧へ戻る</a>
  </div>

  <!-- 左上カードアイコン -->
  <img src="assets/img/イラスト13.webp" class="switch-icon" id="switchIcon">

  <div class="container">
    <div class="left">
      <h1 id="charName">カード</h1>
      <p id="charDesc">カードの説明文をここに書く。</p>
    </div>

    <div class="right">
      <img src="assets/img/イラスト13.webp" id="charImage" class="char-img">
    </div>
  </div>

  <script>
    const characters = [
      { name: "ラム", desc: "ラムの説明文。", img: "assets/img/イラスト9.webp" },
      { name: "アル", desc: "アルの説明文。", img: "assets/img/イラスト10.webp" },
      { name: "カード", desc: "カードの説明文。", img: "assets/img/イラスト13.webp" }
    ];

    let index = 0;
    const switchIcon = document.getElementById("switchIcon");
    const charName = document.getElementById("charName");
    const charDesc = document.getElementById("charDesc");
    const charImage = document.getElementById("charImage");

    switchIcon.addEventListener("click", () => {
      index = (index + 1) % characters.length;
      switchIcon.classList.add("flip");
      setTimeout(() => switchIcon.classList.remove("flip"), 600);
      charName.textContent = characters[index].name;
      charDesc.textContent = characters[index].desc;
      charImage.src = characters[index].img;
    });

    window.addEventListener("scroll", () => {
      const scrollY = window.scrollY;
      charImage.style.transform = `translateY(${scrollY * 0.3}px)`;
    });
  </script>
</body>
</html>
